  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #f0f2f5; padding: 16px; max-width: 650px; margin: 0 auto; }
    h1 { text-align: center; font-size: 24px; margin-bottom: 6px; }
    .subtitle { text-align: center; font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .progress { text-align: center; color: #666; margin-bottom: 20px; font-size: 14px; }

    .candidate {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
      display: flex;
      gap: 16px;
      align-items: flex-start;
      border-left: 10px solid #ccc;
    }
    .candidate img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 10px;
      background: #ddd;
      flex-shrink: 0;
    }
    .candidate-details { flex: 1; }
    .candidate-details h3 { font-size: 20px; margin-bottom: 4px; }
    .party { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .bio { font-size: 14px; color: #444; line-height: 1.4; margin-bottom: 10px; }
    .vote-btn {
      display: block;
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .red { color: #c62828; }
    .blue { color: #1565c0; }
    .orange { color: #e65100; }
    .green { color: #2e7d32; }
    .purple { color: #6a1b9a; }
    .yellow { color: #f9a825; }

    .results-card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
    }
    .restart {
      background: #ff3b30;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      width: 100%;
    }
  </style>
</head>

      if (current >= elections.length) {
        const partyCount = {};
        votes.forEach(v => partyCount[v.party] = (partyCount[v.party] || 0) + 1);

        let html = `<h1>Your Final Ballot</h1>
          <div class="results-card"><h2 style="margin-bottom:14px">Candidates You Voted For</h2>`;
        votes.forEach((v, i) => {
          html += `<div style="margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #eee">
            <strong>${elections[i].title}</strong><br>
            <span class="\( {v.colorClass}"> \){v.name}</span> (${v.party})
          </div>`;
        });
        html += `</div><div class="results-card"><h2 style="margin-bottom:14px">Party Totals</h2>`;
        for (let p in partyCount) {
          html += `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee">
            <span>\( {p}</span><strong> \){partyCount[p]} time${partyCount[p] > 1 ? "s" : ""}</strong>
          </div>`;
        }
        html += `</div><button class="restart" onclick="restart()">Start Over</button>`;
        app.innerHTML = html;
        return;
      }

      const e = elections[current];
      let html = `<h1>U.S. Presidential Election Simulator</h1>
        <div class="subtitle">${e.title}</div>
        <div class="progress">Election ${current + 1} of ${elections.length}</div>`;

      e.candidates.forEach((c, index) => {
        html += `
          <div class="candidate" style="border-left-color:${c.borderColor}">
            <img src="\( {c.image}" alt=" \){c.name}" />
            <div class="candidate-details ${c.colorClass}">
              <h3>${c.name}</h3>
              <div class="party">Party: ${c.party}</div>
              <div class="bio">${c.bio}</div>
              <button class="vote-btn" onclick="vote(${index})">Vote for ${c.name}</button>
            </div>
          </div>`;
      });

      app.innerHTML = html;
    }

    function vote(index) {
      votes.push(elections[current].candidates[index]);
      current++;
      window.scrollTo(0, 0);
      render();
    }

    function restart() {
      current = 0;
      votes = [];
      render();
    }

    render();
  </script>
</body>
</html>
